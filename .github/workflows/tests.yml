name: tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-mapping.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the mapping requirement set
        run: python -m pip install --disable-pip-version-check -r requirements-mapping.txt
      - name: Run the suite
        # OpenVINS, PX4, the simulator environment and the local model are
        # absent on the runner; the tests that need them skip themselves and
        # report that in the log. Everything else must pass.
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.log
      - name: Summarise
        if: always()
        run: |
          tail -n 4 test-output.log
          echo "## Python suite" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^Ran |^OK|^FAILED' test-output.log >> "$GITHUB_STEP_SUMMARY"
          echo "skipped: $(grep -c 'skipped' test-output.log)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output.log
